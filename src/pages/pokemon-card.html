<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers on a notched phone; without it they are always 0 and the
         sheet runs under the notch and the home indicator. Zoom is left
         enabled on purpose - maximum-scale=1 is the usual way to stop iOS
         zooming a small field on focus, and taking pinch-zoom away from
         everyone is not an acceptable price. src/styles/responsive/base.css
         fixes that with a 16px font floor instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pokerole PkCard</title>
    <meta name="description" content="Interactive character sheet and move list for any Pokémon in the Pokerole TTRPG system.">
    <meta name="theme-color" content="#161514">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        /* Where the game database and the sprites live. If you rename or move
           that folder, change THIS ONE LINE. */
        window.DATA_BASE = 'app-data/';
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main/pokemon-card.tsx"></script>
</body>

</html>
